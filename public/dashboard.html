<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — Go Drive</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body data-page="dashboard">
    <header class="site-header site-header--transparent">
        <div class="header-inner">
            <a href="/" class="logo" aria-label="Go Drive"><img src="/images/godrive-logo.png" width="677" height="369" alt="" decoding="async"></a>
            <div class="header-actions">
                <button type="button" class="header-download-btn" id="header-download-btn" data-i18n="header.download_btn">Télécharger</button>
                <label class="lang-switcher">
                    <span class="visually-hidden" data-i18n="lang.label">Langue</span>
                    <select id="lang-select" class="lang-select">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                        <option value="ar">العربية</option>
                    </select>
                </label>
                <button type="button" class="nav-menu-btn" id="nav-menu-btn" aria-expanded="false" aria-controls="site-menu-panel" aria-label="Ouvrir le menu">
                    <span class="nav-menu-btn__bars" aria-hidden="true">
                        <span class="nav-menu-btn__bar"></span>
                        <span class="nav-menu-btn__bar"></span>
                        <span class="nav-menu-btn__bar"></span>
                    </span>
                </button>
            </div>
            <div id="site-menu-panel" class="site-menu-panel" hidden>
                <nav id="nav-links" class="main-nav" aria-label="Navigation principale"></nav>
            </div>
        </div>
    </header>

    <div class="page-hero">
        <div class="page-hero-inner">
            <h1 data-i18n-html="dashboard.hero.title_html"><span class="text-gradient-on-dark">Tableau</span> de bord</h1>
            <p id="dashboard-sub">Gérez vos envois ou vos courses.</p>
        </div>
    </div>

    <div class="container">
        <div class="card" id="clientControls" style="display:none;">
            <h2 style="margin-top: 0; font-family: var(--font-display); font-weight: 700;" data-i18n="dashboard.new_order.title">Nouvelle commande</h2>
            <form id="orderForm">
                <div class="grid">
                    <div class="form-group">
                        <label for="pickup" data-i18n="dashboard.form.pickup">Lieu de départ</label>
                        <input type="text" id="pickup" required>
                    </div>
                    <div class="form-group">
                        <label for="dropoff" data-i18n="dashboard.form.dropoff">Lieu d'arrivée</label>
                        <input type="text" id="dropoff" required>
                    </div>
                    <div class="form-group">
                        <label for="type" data-i18n="dashboard.form.transport">Type de transport</label>
                        <select id="type">
                            <option value="local" data-i18n="dashboard.transport.local">Local</option>
                            <option value="inter-city" data-i18n="dashboard.transport.intercity">Inter-ville</option>
                            <option value="international" data-i18n="dashboard.transport.international">International</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="dashboard.form.submit">Créer la commande</button>
            </form>
        </div>

        <div class="card">
            <h2 style="margin-top: 0; font-family: var(--font-display); font-weight: 700;" data-i18n="dashboard.orders.title">Commandes</h2>
            <div id="ordersList" class="grid"></div>
        </div>
    </div>

    <footer class="site-footer site-footer--simple" lang="fr">
        <div class="footer-simple">
            <div class="footer-simple__top">
                <a href="/" class="footer-simple__logo" aria-label="Go Drive"><img src="/images/godrive-logo.png" width="677" height="369" alt="" decoding="async" loading="lazy"></a>
                <nav class="footer-simple__nav" data-i18n-aria-label="footer.aria" aria-label="Pied de page">
                    <ul class="footer-simple__links">
                        <li><a href="/" data-i18n="nav.home">Accueil</a></li>
                        <li><a href="/guide.html" data-i18n="nav.guide">Comment ça marche</a></li>
                        <li><a href="/about.html" data-i18n="nav.about">À propos</a></li>
                        <li><a href="/contact.html" data-i18n="nav.contact">Contact</a></li>
                        <li><a href="/download-app.html" data-i18n="nav.download">Télécharger l’app</a></li>
                    </ul>
                </nav>
            </div>
            <div class="footer-simple__bottom">
                <p class="footer-simple__copy"><span data-i18n="footer.copy">© Go Drive — Maroc, 2024–2026</span></p>
                <nav class="footer-simple__legal" data-i18n-aria-label="footer.legal_nav_aria" aria-label="Informations légales">
                    <a href="/contact.html#mentions-confidentialite" data-i18n="footer.link.legal">Mentions légales</a>
                </nav>
            </div>
        </div>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/i18n-content.js"></script>
    <script src="js/config.js"></script>
    <script src="js/download-modal.js"></script>
    <script src="js/main.js"></script>
    <script src="js/store-links.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
